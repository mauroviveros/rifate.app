  <!-- Mensaje: para el que recibe el link, no para el organizador -->
  <rect x="64" y="196" width="330" height="46" rx="23" fill="#F5C544"/>
  <text x="229" y="226" text-anchor="middle" class="txt" font-size="17" font-weight="800" letter-spacing="2" fill="#17181C">TE INVITAN A UNA RIFA</text>

  <text x="64" y="330" class="dsp" font-size="68" fill="#F5EEE0">Mirá qué números</text>
  <text x="64" y="404" class="dsp" font-size="68" fill="#F5EEE0">quedan libres</text>

  <text x="64" y="476" class="txt" font-size="27" font-weight="600" fill="#BFBAAC">La grilla está siempre al día.</text>
  <text x="64" y="514" class="txt" font-size="27" font-weight="600" fill="#BFBAAC">Tocá el link y pedí el tuyo.</text>

